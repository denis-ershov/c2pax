name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Каждый понедельник в полночь

jobs:
  security-audit:
    name: Dependency & Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools and upgrade base packaging
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          pip install bandit pip-audit .[all]
      - name: Static Code Security Analysis (Bandit)
        run: bandit -r src/ -ll -i
      - name: Supply Chain Dependency Audit (pip-audit)
        run: pip-audit --desc
